[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprovar"
version = "0.1.0"
description = "A reproducible audit of public germline and somatic cancer-variant evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Syed Sabih Ur Rehman"}]
keywords = ["ClinVar", "CIViC", "variant interpretation", "precision oncology", "reproducibility"]

[project.scripts]
reprovar = "reprovar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
