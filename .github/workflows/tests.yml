name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-reproduction:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run integrity and pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild reports from frozen snapshots
        run: PYTHONPATH=src python -m reprovar.cli analyse
      - name: Confirm generated files are reproducible
        run: git diff --exit-code

